name: Publish GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Determine release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${REF_NAME#v}"
            [[ "${REF_NAME}" == "v${version}" ]] || exit 1
          else
            version="${INPUT_VERSION}"
          fi
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Build and verify
        run: ./gradlew build -Pversion="${{ steps.release.outputs.version }}" --no-daemon

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew publishGithubPackages -Pversion="${{ steps.release.outputs.version }}" --no-daemon
