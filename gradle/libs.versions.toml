[versions]
assertj = "3.27.7"
aws-sdk = "2.53.1"
jacoco = "0.8.14"
junit5 = "5.12.2"
mockito = "5.23.0"
reactor = "2024.0.18"
spring-framework = "6.2.19"
spring-boot3 = "3.5.16"
spring-boot4 = "4.0.7"

[libraries]
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
aws-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
aws-sqs = { module = "software.amazon.awssdk:sqs" }
aws-sso = { module = "software.amazon.awssdk:sso" }
aws-ssooidc = { module = "software.amazon.awssdk:ssooidc" }
aws-sts = { module = "software.amazon.awssdk:sts" }
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind" }
junit5-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
micrometer-core = { module = "io.micrometer:micrometer-core" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
reactor-bom = { module = "io.projectreactor:reactor-bom", version.ref = "reactor" }
reactor-core = { module = "io.projectreactor:reactor-core" }
reactor-test = { module = "io.projectreactor:reactor-test" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring-framework" }
spring-boot3-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot3" }
spring-boot4-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot4" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
